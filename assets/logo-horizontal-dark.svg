  <text x="205" y="124" font-family="Inter, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif" font-size="80" font-weight="700" fill="#F8FAFC" letter-spacing="1">ComposerChat</text>
  <text x="208" y="158" font-family="Inter, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#94A3B8" letter-spacing="2">确定性音乐创作内核</text>
