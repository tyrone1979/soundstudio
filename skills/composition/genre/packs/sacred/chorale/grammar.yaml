hard_rules:
- id: R01
  rule: 任意两声部不得连续纯五度 / 纯八度 / 同度（含反向）
- id: R02
  rule: 外声部同向进入纯五 / 纯八度时，女高音须级进（禁隐伏五八度）
- id: R03
  rule: 声部不交叉；相邻声部不越过对方上一拍的音（禁超越）
- id: R04
  rule: 间距：女高–中音、中音–次中音不超过八度；次中音–低音不超过十二度
- id: R05
  rule: 各声部在学到的音域内
- id: R06
  rule: 外声部的导音在属→主时上行解决到主音
- id: R07
  rule: 和弦七音级进下行解决（或在下一和弦里保持）
- id: R08
  rule: 旋律不得增音程、不得大于八度的跳进、不得七度跳进
- id: R09
  rule: 导音不重复；三和弦必须有三音，七和弦必须有根、三、七音
- id: R10
  rule: 和弦转移须是巴赫语料里出现过的二元组（语法内）
- id: R11
  rule: 每句以学到的终止公式结束；全曲以完全正格终止结束
calibration:
  sop_repeat_bias: 2.0
  say: 女高音同音反复的对数概率偏置：和声、音程、角色、轮廓几项相乘时会重复奖励"原地不动"。原值 0.6 的说明声称"生成曲同音比例约 22% 与语料一致"，实测已失效（0.249，真实巴赫 0.159）——很是在其它项改动后没有重校。扫
    0.6/1.2/2.0/3.0 后取 2.0：生成曲同音反复 0.138、3 音动机重复 0.263、级进占比 0.868、音域 11.1，同音/级进/音域三项分别对齐真实巴赫的 0.159/0.857/11.4，且硬规则零违例。
