    character: 中速到快速摇摆；八分音符按长-短奏。
  meter:
    primary: 4/4
    allowed:
    - 4/4
    description: 绝大多数为 4/4。
    empirical_note: 'From 426 scores: 4/4=98%, 3/4=1%, 6/8=0%, 5/4=0%, 6/4=0%'
  rhythm:
    identity: swing eighth feel
    accompaniment:
      default: walking_bass_and_comping
    melodic_preferred:
    - syncopation
    - bebop_scale_run
    - off_beat_phrasing
    melodic_avoid:
    - square_on_beat_only
  phrase:
    length: 4
    character: 2 或 4 小节为一乐句，AABA/ABAC 主题群；乐句末常留白呼吸， 不规律地落在强拍终止。
  harmony:
    vocabulary_basic:
    - ii7
    - V7
    - IM7
    - vi7
    - iiø7
    - V7alt
    progressions:
    # 显式七和弦：避免骨架只喂 ii-V-I 三和弦、再靠随机品质改写落到光三和弦
    - ii7–V7–Imaj7
    - Imaj7–VI7–ii7–V7
    - ii7–V7–Imaj7–vi7
    - Imaj7–ii7–V7–Imaj7
    forbidden:
    - bare_triad_only_accompaniment
    harmonic_rhythm_empirical: 语料约 1.12 和弦/小节
  melody:
    character: 切分迁移；前后句型不对称，动机可跨小节
    contour_preferred:
    - stepwise
    - angular
    - bebop_line
    range_default:
      low: C4
      high: C6
    stepwise_ratio_target: 0.455
    rules: 语料级进比约 46%；大跳比约 18%。以级进为主。
    leap_ratio_target: 0.177
  texture:
    primary: melody_plus_chord_symbols
    density: lead_sheet
  register:
    melody:
      low: C4
      high: C6
  color:
    instrumentation: 铜管（可加弱音器）+ 钢琴 comping + 走动低音 + 鼓刷
    character: 音响由七和弦与替代和声决定，节奏组保持不间断的摆动。
  constraints:
    must:
    - 和弦默认写成七和弦（ii7 / V7 / IM7 / vi7 / iiø7），不要只用三和弦。
    - 写上主要的 ii–V–I 进行。
    - 旋律要有切分感，但必须留下可辨认的动机。
    - 拍号以 4/4 为主（语料 98%）。
    avoid:
    - 只用三和弦伴奏；把爵士写成浪漫时期的和声练习。
