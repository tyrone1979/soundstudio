llm_instruction: 落实摇摆标准曲：七和弦为基本颗粒、ii–V–I 惯性、旋律切分；和弦标记与伴奏声部要一致。仅原创。 落实语料实证：级进为主、核心拍号、功能和声终止；勿背诵训练曲旋律。
