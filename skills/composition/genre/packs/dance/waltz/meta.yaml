llm_instruction: 不要只把 “Waltz” 写进元数据。把本规格落实为可听见的音乐决策： STYLE → 调性中心 → 三拍节奏身份 → 动机 →
  乐句 → 和声 → 旋律 → 伴奏 → 曲式 → 力度 → SCORE JSON。 听者应能感知：三拍舞步、强第一拍、轻二三拍、歌唱上声部、功能和声、清楚乐句、优雅室内乐织体。
  仅原创；禁止抄袭可识别的维也纳圆舞经典主题。 落实语料实证：级进为主、核心拍号、功能和声终止；勿背诵训练曲旋律。
