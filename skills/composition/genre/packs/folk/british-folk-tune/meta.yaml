llm_instruction: 落实英伦/爱尔兰曲调：单一旋律骨架、方整舞曲乐句、自然音级为主，重复音型推动。仅原创。 落实语料实证：级进为主、核心拍号、功能和声终止；勿背诵训练曲旋律。
