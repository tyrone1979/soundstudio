summary: 英伦/爱尔兰民谣舞曲：8 小节方整乐句对、鲜明舞波动律、单一旋律线加可选项持续低音。
profile:
  mode: 常用自然小调、多利亚、混合利底亚；少用强烈导音。
  tonal_center:
    preferred:
    - D major
    - G major
    - D dorian
    - G major pentatonic-like
    secondary:
    - A dorian
    - E minor
    - D mixolydian
    empirical_key_dist:
      C major: 0.041
      D major: 0.312
      G major: 0.282
      A major: 0.116
      G minor: 0.018
