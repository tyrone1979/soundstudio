      A minor: 0.046
      E minor: 0.097
      D minor: 0.017
      B minor: 0.035
      B- major: 0.005
      F# minor: 0.007
      B major: 0.001
  tempo:
    unit: quarter_note
    min: 96
    max: 168
    default: 120
    character: 舞曲性；因体裁（jig/reel/hornpipe）大幅波动。
  meter:
    primary: 6/8
    allowed:
    - 6/8
    - 4/4
    - 2/4
    - 9/8
    description: jig 多为 6/8 与 9/8，reel 为 4/4，hornpipe 为 4/4。
  rhythm:
    identity: dance pattern driven
    accompaniment:
      default: drone_or_none
      alternatives:
      - guitar_or_bouzouki
    melodic_preferred:
    - even_note_run
    - stepwise
    - repeated_bar_pattern
    melodic_avoid:
    - rubato_free
  phrase:
    preferred:
    - 4+4
    description: A 段 + B 段各 8 小节，各自反复，是标准 doubled tune 形态。
  cadence:
    eight_bar: half_or_full
    final: 完全终止或回主终止。
  harmony:
    vocabulary_basic:
    - I
    - IV
    - V
    - vi
    - ii
    progressions:
    - I–V–I
    - I–IV–I–V
    forbidden:
    - dense_chromatic_harmony
    harmonic_rhythm_empirical: 语料约 1.22 和弦/小节
  melody:
    character: 单线条主导；大量级进与小跳，重复音型推动
    contour_preferred:
    - stepwise
    - balanced
    range_default:
      low: D4
      high: A5
    stepwise_ratio_target: 0.53
    rules: 语料级进比约 53%；大跳比约 13%。以级进为主。
    leap_ratio_target: 0.131
  texture:
    primary: monophonic_tune
    density: single_line
  register:
    melody:
      low: D4
      high: A5
  color:
    instrumentation: 单声旋律乐器（提琴/哨笛/风笛类）
    character: 不加和声铺底；重复音型与装饰音是唯一色彩手段。
  constraints:
    must:
    - 单一旋律线为骨架；和声不要压过旋律。
    - 乐句方整（多为 8 小节段落）。
    avoid:
    - 过度半音化；摇摆不准之类的书写。
  priority:
