    hard_rules:
    - id: R01
      rule: 强拍音必须是和弦音，或者是下一音级进解决的倚音（语料强拍和弦音 83%）
      param:
        strict_ct_threshold: 0.7
        corpus_ct_rate: 0.8258
        strict: true
    - id: R02
      rule: 非和弦音必须级进进入或级进离开（经过音、邻音、倚音、换音；语料 93%）
      param:
        strict_step_threshold: 0.85
        corpus_step_rate: 0.926
        strict: true
    - id: R03
      rule: 旋律跳进不超过 12 个半音（语料 99.5% 分位）
      param:
        max_leap: 12
    - id: R05
      rule: 旋律音域 MIDI 50–86（语料 1%–99% 分位）
      param:
        range_low: 50
        range_high: 86
    - id: R06
      rule: 全曲结束于主和弦，旋律末音为主音
    - id: R07
      rule: 和弦只用词表内的和弦，和弦转移必须在语料中出现过
    - id: R08
      rule: 钢琴右手（旋律）与左手伴奏之间不得同向进入平行五度 / 八度（左手和弦按高→低拆成声部逐条检查，同手内只查五度）；左手不高过旋律，低音不高过旋律
    - id: R10
      rule: 同一个和弦连续不超过 6 小节（语料 95% 分位）
      param:
        max_same_chord_bars: 6
    - id: R09
      rule: 每小节的节奏取自学到的节奏模板（R 规则）
