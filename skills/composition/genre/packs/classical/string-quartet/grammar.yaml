    hard_rules:
    - id: R01
      rule: 强拍音必须是和弦音，或者是下一音级进解决的倚音（语料强拍和弦音 88%）
      param:
        strict_ct_threshold: 0.7
        corpus_ct_rate: 0.88
        strict: true
    - id: R02
      rule: 非和弦音必须级进进入或级进离开（经过音、邻音、倚音、换音；语料 90%）
      param:
        strict_step_threshold: 0.85
        corpus_step_rate: 0.904
        strict: true
    - id: R03
      rule: 旋律跳进不超过 12 个半音（语料 99.5% 分位）
      param:
        max_leap: 12
    - id: R04
      rule: 不用罕见跳进（语料中低于 0.3%）：11 半音
      param:
        forbidden_leaps:
        - 11
    - id: R05
      rule: 旋律音域 MIDI 59–90（语料 1%–99% 分位）
      param:
        range_low: 59
        range_high: 90
    - id: R06
      rule: 全曲结束于主和弦，旋律末音为主音
    - id: R07
      rule: 和弦只用词表内的和弦，和弦转移必须在语料中出现过
    - id: R08
      rule: 第一小提琴、第二小提琴、中提琴、大提琴两两之间不得同向进入平行五度 / 八度；内声部不高过第一小提琴，大提琴不高过旋律
    - id: R10
      rule: 同一个和弦连续不超过 7 小节（语料 95% 分位）
      param:
        max_same_chord_bars: 7
    - id: R09
      rule: 每小节的节奏取自学到的节奏模板（R 规则）
