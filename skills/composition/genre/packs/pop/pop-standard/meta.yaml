llm_instruction: 落实流行标准曲：主歌-副歌两段对比、循环和弦进行、短钩子旋律反复；织体服务于主唱声部。仅原创。 落实语料实证：级进为主、核心拍号、功能和声终止；勿背诵训练曲旋律。
