    contour_preferred:
    - stepwise
    - repeated_hook
    range_default:
      low: A3
      high: E5
    stepwise_ratio_target: 0.33
    rules: 语料级进比约 33%；大跳比约 17%。以级进为主。
    leap_ratio_target: 0.168
  texture:
    primary: lead_vocal_plus_band
    density: groove_layers
  register:
    melody:
      low: A3
      high: E5
  color:
    instrumentation: 乐队 + 主唱
    character: 主歌收薄、副歌加层；反拍与循环进行是主要推动力。
  constraints:
    must:
    - 主歌与副歌有清晰的织体/音区对比。
    - 和弦进行循环并贯穿段落。
    - 拍号以 4/4 为主（语料 90%）。
    avoid:
