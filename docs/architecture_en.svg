<svg viewBox="0 0 680 706" width="680" height="706" role="img" xmlns="http://www.w3.org/2000/svg">
<title>composerchat learning and generation architecture</title>
<desc>Three offline learning pipelines (chorale, leadsheet, relation) all write into one grammar.yaml, which the online generation phase reads through plan_form, harmony_unit and melody_dp.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.t15 { font-size: 15px; font-weight: 500; }
.t14 { font-size: 14px; font-weight: 500; }
.t13 { font-size: 13px; font-weight: 500; }
.t12 { font-size: 12px; font-weight: 400; }
</style>

<rect width="680" height="706" fill="#FFFFFF"/>

<rect x="40" y="68" width="600" height="228" rx="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="56" y="90" class="t14" fill="#0C447C">Learning phase — offline</text>

<rect x="56" y="140" width="92" height="56" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="102" y="160" class="t13" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Corpus</text>
<text x="102" y="178" class="t12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">MusicXML, MIDI</text>

<path d="M152 168 L166 168" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="170" y="140" width="80" height="56" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="210" y="160" class="t13" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Analyzer</text>
<text x="210" y="178" class="t12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">beats, bars</text>

<path d="M254 168 L272 168 L272 128 L284 128" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M254 168 L284 168" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M254 168 L272 168 L272 208 L284 208" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="288" y="104" width="182" height="48" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="302" y="122" class="t13" fill="#0C447C" dominant-baseline="central">1 · Chorale</text>
<text x="302" y="139" class="t12" fill="#185FA5" dominant-baseline="central">Witten-Bell + k-means</text>

<rect x="288" y="160" width="182" height="48" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="302" y="178" class="t13" fill="#0C447C" dominant-baseline="central">2 · Leadsheet × 8 genres</text>
<text x="302" y="195" class="t12" fill="#185FA5" dominant-baseline="central">WB + k-means + budget</text>

<rect x="288" y="216" width="182" height="48" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5" stroke-dasharray="5 3"/>
<text x="302" y="234" class="t13" fill="#0C447C" dominant-baseline="central">3 · Relation</text>
<text x="302" y="251" class="t12" fill="#185FA5" dominant-baseline="central">manual annotation, no stats</text>

<path d="M474 128 L496 128 L496 160 L508 160" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M474 184 L508 184" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M474 240 L496 240 L496 208 L508 208" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="512" y="128" width="112" height="112" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="568" y="152" class="t13" fill="#042C53" text-anchor="middle" dominant-baseline="central">grammar.yaml</text>
<text x="568" y="172" class="t12" fill="#0C447C" text-anchor="middle" dominant-baseline="central">the only contract</text>
<text x="568" y="196" class="t12" fill="#0C447C" text-anchor="middle" dominant-baseline="central">+ grammar.md</text>
<text x="568" y="214" class="t12" fill="#0C447C" text-anchor="middle" dominant-baseline="central">human readable</text>

<rect x="56" y="320" width="568" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5" stroke-dasharray="5 3"/>
<text x="340" y="338" class="t13" fill="#085041" text-anchor="middle" dominant-baseline="central">/learn-all</text>
<text x="340" y="357" class="t12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">runs all three pipelines, writes them in one pass (17 s)</text>

<path d="M340 296 L340 316" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 376 L340 404" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="408" width="600" height="278" rx="20" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="56" y="430" class="t14" fill="#085041">Generation phase — online</text>

<rect x="56" y="448" width="568" height="40" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="468" class="t13" fill="#085041" text-anchor="middle" dominant-baseline="central">/compose-grammar → kernel.leadsheet_grammar</text>

<path d="M340 488 L340 500" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="56" y="504" width="568" height="40" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
<text x="72" y="524" class="t13" fill="#085041" dominant-baseline="central">1 · plan_form</text>
<text x="200" y="524" class="t12" fill="#0F6E56" dominant-baseline="central">form_plan — section role, length, reference chain</text>

<path d="M340 544 L340 556" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="56" y="560" width="568" height="40" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
<text x="72" y="580" class="t13" fill="#085041" dominant-baseline="central">2 · harmony_unit</text>
<text x="200" y="580" class="t12" fill="#0F6E56" dominant-baseline="central">forward-backward filtering over chord transitions</text>

<path d="M340 600 L340 612" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="56" y="616" width="568" height="40" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
<text x="72" y="636" class="t13" fill="#085041" dominant-baseline="central">3 · melody_dp</text>
<text x="200" y="636" class="t12" fill="#0F6E56" dominant-baseline="central">dynamic programming + forward-backward sampling</text>

<path d="M340 656 L340 664" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="340" y="680" class="t12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">spec → MusicXML → playback and export</text>
</svg>
